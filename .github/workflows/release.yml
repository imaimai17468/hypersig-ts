name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Check that the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: Install redis-server for the Redis tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl disable --now redis-server
      - run: bun run check
      - run: bun run test
        env:
          REDIS_REQUIRED: "1"
      - run: bun run test:redis:bun
        env:
          REDIS_REQUIRED: "1"
      - run: bun run build
      - name: Configure the npm registry
        run: npm config set registry https://registry.npmjs.org/
      # Authenticates through trusted publishing (OIDC); see RELEASING.md.
      - run: npm publish --provenance --access public
